# Docker's DNS, so containers that restart (new IP) are found again.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 3m;
    server_tokens off;

    set $api http://api:8000;
    set $worker http://worker:6080;

    # API (incl. server-sent events for live logs).
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Login check for the live browser.
    location = /_auth {
        internal;
        proxy_pass $api/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # noVNC asks for its package.json (version only); Debian's package doesn't ship it.
    location = /novnc/package.json {
        default_type application/json;
        return 200 '{"version": ""}';
    }

    # Live Chrome view (noVNC + websocket), only for logged-in users.
    location /novnc/ {
        auth_request /_auth;
        rewrite ^/novnc/(.*)$ /$1 break;
        proxy_pass $worker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
